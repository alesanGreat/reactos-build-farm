name: ReactOS Target Build

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public ReactOS repository to build (owner/repo)
        required: true
        default: alesanGreat/reactos
        type: string
      source_ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: master
        type: string
      arch:
        description: ReactOS architecture
        required: true
        default: i386
        type: choice
        options:
          - i386
          - amd64
      compiler:
        description: RosBE compiler
        required: true
        default: gcc
        type: choice
        options:
          - gcc
          - clang
      build_type:
        description: CMake build type
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      targets:
        description: 'Space-separated Ninja/CMake targets (for example: cmd cmd_apitest)'
        required: true
        default: bootcd
        type: string
      enable_rostests:
        description: Configure with ENABLE_ROSTESTS=1
        required: true
        default: true
        type: boolean
      enable_rosapps:
        description: Configure with ENABLE_ROSAPPS=1
        required: true
        default: false
        type: boolean
      i18n_lang:
        description: I18N_LANG value; en-US keeps targeted builds lean
        required: true
        default: en-US
        type: string
      runtime_qemu:
        description: Run the built ISO headlessly under QEMU after a successful build
        required: true
        default: false
        type: boolean
      runtime_video:
        description: QEMU VGA model for runtime validation
        required: true
        default: std
        type: choice
        options:
          - std
          - vmware
      runtime_iso:
        description: ISO basename in the build directory to boot when runtime_qemu is enabled
        required: true
        default: bootcd.iso
        type: string
      runtime_marker:
        description: Fixed string that must appear on COM1 or COM2 for runtime success
        required: false
        default: ''
        type: string
      runtime_timeout_seconds:
        description: Maximum QEMU runtime before the marker is considered missing
        required: true
        default: 300
        type: number

permissions:
  contents: read

concurrency:
  group: reactos-target-${{ inputs.source_repository }}-${{ inputs.source_ref }}-${{ inputs.arch }}-${{ inputs.compiler }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ inputs.compiler }} ${{ inputs.arch }} ${{ inputs.build_type }} — ${{ inputs.targets }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Validate requested build
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TARGETS_RAW: ${{ inputs.targets }}
          I18N_LANG: ${{ inputs.i18n_lang }}
          RUNTIME_QEMU: ${{ inputs.runtime_qemu }}
          RUNTIME_VIDEO: ${{ inputs.runtime_video }}
          RUNTIME_ISO: ${{ inputs.runtime_iso }}
          RUNTIME_MARKER: ${{ inputs.runtime_marker }}
          RUNTIME_TIMEOUT_SECONDS: ${{ inputs.runtime_timeout_seconds }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid source_repository: $SOURCE_REPOSITORY" >&2
            exit 2
          fi
          if [[ -z "$SOURCE_REF" || "$SOURCE_REF" == *$'\n'* || "$SOURCE_REF" == *$'\r'* ]]; then
            echo "Invalid source_ref" >&2
            exit 2
          fi
          if [[ ! "$I18N_LANG" =~ ^[A-Za-z0-9_.@+-]+$ ]]; then
            echo "Invalid i18n_lang: $I18N_LANG" >&2
            exit 2
          fi
          if [[ "$RUNTIME_QEMU" == "true" ]]; then
            if [[ "$RUNTIME_VIDEO" != "std" && "$RUNTIME_VIDEO" != "vmware" ]]; then
              echo "Invalid runtime_video: $RUNTIME_VIDEO" >&2
              exit 2
            fi
            if [[ ! "$RUNTIME_ISO" =~ ^[A-Za-z0-9_.-]+\.iso$ ]]; then
              echo "Invalid runtime_iso: $RUNTIME_ISO" >&2
              exit 2
            fi
            if [[ -z "$RUNTIME_MARKER" || "$RUNTIME_MARKER" == *$'\n'* || "$RUNTIME_MARKER" == *$'\r'* ]]; then
              echo "runtime_marker must be a non-empty single-line fixed string" >&2
              exit 2
            fi
            if (( RUNTIME_TIMEOUT_SECONDS < 30 || RUNTIME_TIMEOUT_SECONDS > 1800 )); then
              echo "runtime_timeout_seconds must be between 30 and 1800" >&2
              exit 2
            fi
          fi

          read -r -a target_array <<< "$TARGETS_RAW"
          if (( ${#target_array[@]} == 0 || ${#target_array[@]} > 24 )); then
            echo "targets must contain between 1 and 24 targets" >&2
            exit 2
          fi
          : > "$GITHUB_WORKSPACE/targets.txt"
          for target in "${target_array[@]}"; do
            if [[ ! "$target" =~ ^[A-Za-z0-9_.:+/-]+$ ]]; then
              echo "Invalid target: $target" >&2
              exit 2
            fi
            printf '%s\n' "$target" >> "$GITHUB_WORKSPACE/targets.txt"
          done

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          {
            echo "source_repository=$SOURCE_REPOSITORY"
            echo "source_ref=$SOURCE_REF"
            echo "targets=$TARGETS_RAW"
            echo "runtime_qemu=$RUNTIME_QEMU"
            echo "runtime_video=$RUNTIME_VIDEO"
            echo "runtime_iso=$RUNTIME_ISO"
            echo "runtime_marker=$RUNTIME_MARKER"
            echo "runtime_timeout_seconds=$RUNTIME_TIMEOUT_SECONDS"
            echo "requested_by=${{ github.actor }}"
            echo "run_id=${{ github.run_id }}"
          } > "$GITHUB_WORKSPACE/artifacts/request.txt"

      - name: Get RosBE build specifics
        id: get_rosbe_spec
        shell: bash
        run: |
          set -euo pipefail
          echo "-march = $(gcc -march=native -Q --help=target | grep '\-march=  ' | awk '{print $NF}')"
          echo "march-sha=$(gcc -march=native -Q --help=target | sha1sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "git-sha=$(git ls-remote https://github.com/zefklop/RosBE.git | grep unix_amd64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          wget --tries=5 --waitretry=5 --retry-on-http-error=429,500,502,503,504 -q \
            https://gist.githubusercontent.com/zefklop/b2d6a0b470c70183e93d5285a03f5899/raw/build_rosbe_ci.sh
          # The upstream bootstrap does not stop on failed downloads. Harden every
          # wget it launches so transient GNU/SourceForge failures do not silently
          # produce an incomplete RosBE tree.
          sed -i 's/^wget /wget --tries=5 --waitretry=5 --retry-on-http-error=429,500,502,503,504 /' build_rosbe_ci.sh

      - name: Restore RosBE cache
        id: get_rosbe
        uses: actions/cache@v5
        with:
          path: RosBE-CI
          key: RosBE-CI-${{ runner.os }}-${{ steps.get_rosbe_spec.outputs.march-sha }}-${{ steps.get_rosbe_spec.outputs.git-sha }}-${{ hashFiles('./build_rosbe_ci.sh') }}

      - name: Ensure RosBE toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "$GITHUB_WORKSPACE/RosBE-CI/RosBE.sh" ]]; then
            echo "Using validated RosBE cache"
            exit 0
          fi

          chmod +x build_rosbe_ci.sh
          for attempt in 1 2 3; do
            echo "Building RosBE, attempt $attempt/3"
            rm -rf "$GITHUB_WORKSPACE/RosBE-CI"
            attempt_dir="$RUNNER_TEMP/rosbe-bootstrap-$attempt"
            rm -rf "$attempt_dir"
            mkdir -p "$attempt_dir"

            if (cd "$attempt_dir" && \
                "$GITHUB_WORKSPACE/build_rosbe_ci.sh" "$GITHUB_WORKSPACE/RosBE-CI"); then
              :
            else
              echo "RosBE bootstrap returned failure on attempt $attempt" >&2
            fi

            if [[ -x "$GITHUB_WORKSPACE/RosBE-CI/RosBE.sh" ]]; then
              echo "RosBE validated after attempt $attempt"
              exit 0
            fi

            echo "RosBE bootstrap produced no RosBE.sh on attempt $attempt" >&2
            rm -rf "$GITHUB_WORKSPACE/RosBE-CI" "$attempt_dir"
            sleep $((attempt * 5))
          done

          echo "RosBE bootstrap failed after 3 attempts" >&2
          exit 1

      - name: Ensure build dependencies
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's Ubuntu images normally ship Ninja already. Do not make every
          # ReactOS build depend on an apt mirror just to reinstall it.
          if ! command -v ninja >/dev/null 2>&1; then
            installed=0
            for attempt in 1 2 3; do
              echo "Installing Ninja, attempt $attempt/3"
              if timeout 180s sudo apt-get \
                    -o Acquire::Retries=5 \
                    -o Acquire::http::Timeout=20 \
                    -o Acquire::https::Timeout=20 \
                    -o DPkg::Lock::Timeout=30 \
                    update -qq && \
                 timeout 180s sudo env DEBIAN_FRONTEND=noninteractive apt-get \
                    -o Acquire::Retries=5 \
                    -o Acquire::http::Timeout=20 \
                    -o Acquire::https::Timeout=20 \
                    -o DPkg::Lock::Timeout=30 \
                    install -y --no-install-recommends ninja-build; then
                installed=1
                break
              fi
              sleep $((attempt * 5))
            done
            if [[ "$installed" != 1 ]]; then
              echo "Unable to install required Ninja build tool" >&2
              exit 1
            fi
          fi
          ninja --version

          # ccache is an optimization, not a build requirement. If the runner
          # image does not already have it, build normally instead of blocking
          # on apt solely for ccache.
          if command -v ccache >/dev/null 2>&1; then
            echo "ENABLE_CCACHE_EFFECTIVE=1" >> "$GITHUB_ENV"
            ccache --version | head -n 1
          else
            echo "ENABLE_CCACHE_EFFECTIVE=0" >> "$GITHUB_ENV"
            echo "ccache unavailable; continuing without compiler cache"
          fi

      - name: Install LLVM for clang
        if: inputs.compiler == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          export LLVM_VERSION=13
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          echo "D_CLANG_VERSION=-DCLANG_VERSION=$LLVM_VERSION" >> "$GITHUB_ENV"

      - name: Checkout requested ReactOS ref
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: src
          fetch-depth: 1

      - name: Snapshot initial source state
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/src"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          git -C "$source_root" rev-parse HEAD > "$artifact_root/source-sha.txt"
          git -C "$source_root" status --short > "$artifact_root/source-status-initial.txt"
          git -C "$source_root" status --porcelain=v1 -z --untracked-files=all > "$artifact_root/source-state-initial.bin"
          git -C "$source_root" diff --no-ext-diff --binary > "$artifact_root/source-diff-initial.patch"
          git -C "$source_root" diff --cached --no-ext-diff --binary > "$artifact_root/source-index-diff-initial.patch"
          cat "$artifact_root/source-state-initial.bin" \
              "$artifact_root/source-diff-initial.patch" \
              "$artifact_root/source-index-diff-initial.patch" |
            sha256sum | awk '{print $1}' > "$artifact_root/source-state-initial.sha256"

      - name: Configure ccache
        shell: bash
        run: |
          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/ccache"
            echo "CCACHE_MAXSIZE=1G"
            echo "CCACHE_SLOPPINESS=time_macros"
            echo "CCACHE_COMPILERCHECK=string:${{ steps.get_rosbe_spec.outputs.git-sha }}-${{ hashFiles('./build_rosbe_ci.sh') }}"
          } >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ccache
          key: reactos-ccache-${{ inputs.compiler }}-${{ inputs.arch }}-${{ inputs.build_type }}-${{ inputs.source_ref }}-${{ github.run_id }}
          restore-keys: |
            reactos-ccache-${{ inputs.compiler }}-${{ inputs.arch }}-${{ inputs.build_type }}-

      - name: Configure ReactOS
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          COMPILER: ${{ inputs.compiler }}
          BUILD_TYPE: ${{ inputs.build_type }}
          I18N_LANG: ${{ inputs.i18n_lang }}
          ENABLE_ROSTESTS: ${{ inputs.enable_rostests && '1' || '0' }}
          ENABLE_ROSAPPS: ${{ inputs.enable_rosapps && '1' || '0' }}
        run: |
          set -euo pipefail
          cmd="cmake -S $GITHUB_WORKSPACE/src -B $GITHUB_WORKSPACE/build -G Ninja -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-${COMPILER}.cmake -DARCH:STRING=${ARCH} -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DENABLE_CCACHE=${ENABLE_CCACHE_EFFECTIVE} -DENABLE_ROSTESTS=${ENABLE_ROSTESTS} -DENABLE_ROSAPPS=${ENABLE_ROSAPPS} -DI18N_LANG=${I18N_LANG} ${D_CLANG_VERSION:-}"
          echo "$cmd" > "$GITHUB_WORKSPACE/artifacts/configure-command.txt"
          printf '%s\n' "$cmd" | "$GITHUB_WORKSPACE/RosBE-CI/RosBE.sh" . 0 "$ARCH" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/configure.log"

      - name: Build requested targets
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          targets_joined="$(paste -sd' ' "$GITHUB_WORKSPACE/targets.txt")"
          cmd="cmake --build $GITHUB_WORKSPACE/build --target ${targets_joined} -- -k0"
          echo "$cmd" > "$GITHUB_WORKSPACE/artifacts/build-command.txt"
          printf '%s\n' "$cmd" | "$GITHUB_WORKSPACE/RosBE-CI/RosBE.sh" . 0 "$ARCH" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/build.log"

      - name: Ensure QEMU runtime dependency
        if: inputs.runtime_qemu
        shell: bash
        run: |
          set -euo pipefail
          qemu_bin="qemu-system-i386"
          if [[ "${{ inputs.arch }}" == "amd64" ]]; then
            qemu_bin="qemu-system-x86_64"
          fi
          if command -v "$qemu_bin" >/dev/null 2>&1; then
            "$qemu_bin" --version | head -n 1
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing QEMU, attempt $attempt/3"
            if timeout 180s sudo apt-get \
                  -o Acquire::Retries=5 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 \
                  -o DPkg::Lock::Timeout=30 \
                  update -qq && \
               timeout 300s sudo env DEBIAN_FRONTEND=noninteractive apt-get \
                  -o Acquire::Retries=5 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 \
                  -o DPkg::Lock::Timeout=30 \
                  install -y --no-install-recommends qemu-system-x86; then
              "$qemu_bin" --version | head -n 1
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Unable to install QEMU runtime dependency" >&2
          exit 1

      - name: Run headless QEMU runtime
        if: inputs.runtime_qemu
        shell: bash
        env:
          RUNTIME_VIDEO: ${{ inputs.runtime_video }}
          RUNTIME_ISO: ${{ inputs.runtime_iso }}
          RUNTIME_MARKER: ${{ inputs.runtime_marker }}
          RUNTIME_TIMEOUT_SECONDS: ${{ inputs.runtime_timeout_seconds }}
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/artifacts/runtime"
          mkdir -p "$runtime_dir"
          runtime_result="$runtime_dir/result.txt"
          iso_path="$GITHUB_WORKSPACE/build/$RUNTIME_ISO"
          if [[ ! -f "$iso_path" ]]; then
            {
              echo "video=$RUNTIME_VIDEO"
              echo "iso=$RUNTIME_ISO"
              echo "marker=$RUNTIME_MARKER"
              echo "marker_found=0"
              echo "failure=iso_missing"
            } > "$runtime_result"
            echo "Runtime ISO not found: $iso_path" >&2
            exit 1
          fi

          qemu_bin="qemu-system-i386"
          if [[ "${{ inputs.arch }}" == "amd64" ]]; then
            qemu_bin="qemu-system-x86_64"
          fi
          com1="$runtime_dir/com1.log"
          com2="$runtime_dir/com2.log"
          qemu_log="$runtime_dir/qemu.log"
          : > "$com1"
          : > "$com2"
          : > "$qemu_log"

          printf '%q ' "$qemu_bin" -machine pc,accel=kvm:tcg -m 512 -boot order=d \
            -cdrom "$iso_path" -vga "$RUNTIME_VIDEO" -display none -monitor none \
            -serial "file:$com1" -serial "file:$com2" -no-reboot \
            > "$runtime_dir/qemu-command.txt"
          printf '\n' >> "$runtime_dir/qemu-command.txt"

          "$qemu_bin" \
            -machine pc,accel=kvm:tcg \
            -m 512 \
            -boot order=d \
            -cdrom "$iso_path" \
            -vga "$RUNTIME_VIDEO" \
            -display none \
            -monitor none \
            -serial "file:$com1" \
            -serial "file:$com2" \
            -no-reboot \
            > "$qemu_log" 2>&1 &
          qemu_pid=$!
          marker_found=0
          qemu_exited=0
          qemu_rc=0

          for ((elapsed=0; elapsed<RUNTIME_TIMEOUT_SECONDS; elapsed+=2)); do
            if grep -Fq -- "$RUNTIME_MARKER" "$com1" || grep -Fq -- "$RUNTIME_MARKER" "$com2"; then
              marker_found=1
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              qemu_exited=1
              set +e
              wait "$qemu_pid"
              qemu_rc=$?
              set -e
              break
            fi
            sleep 2
          done

          if kill -0 "$qemu_pid" 2>/dev/null; then
            kill "$qemu_pid" 2>/dev/null || true
            for _ in {1..10}; do
              if ! kill -0 "$qemu_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if kill -0 "$qemu_pid" 2>/dev/null; then
              kill -9 "$qemu_pid" 2>/dev/null || true
            fi
            wait "$qemu_pid" 2>/dev/null || true
          fi

          {
            echo "video=$RUNTIME_VIDEO"
            echo "marker=$RUNTIME_MARKER"
            echo "marker_found=$marker_found"
            echo "qemu_exited_before_marker=$qemu_exited"
            echo "qemu_exit_code=$qemu_rc"
          } > "$runtime_result"

          if [[ "$marker_found" != 1 ]]; then
            echo "Runtime marker not observed: $RUNTIME_MARKER" >&2
            echo "--- COM1 tail ---" >&2
            tail -n 80 "$com1" >&2 || true
            echo "--- COM2 tail ---" >&2
            tail -n 80 "$com2" >&2 || true
            echo "--- QEMU tail ---" >&2
            tail -n 80 "$qemu_log" >&2 || true
            exit 1
          fi
          echo "Observed runtime marker: $RUNTIME_MARKER"

      - name: Verify source tree did not change
        if: always()
        shell: bash
        run: |
          source_root="$GITHUB_WORKSPACE/src"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          source_changed=0

          if [[ -d "$source_root/.git" ]]; then
            git -C "$source_root" rev-parse HEAD > "$artifact_root/source-sha.txt" || true
            git -C "$source_root" status --short > "$artifact_root/source-status.txt" || true
            git -C "$source_root" status --porcelain=v1 -z --untracked-files=all > "$artifact_root/source-state-final.bin" || true
            git -C "$source_root" diff --no-ext-diff --binary > "$artifact_root/source-diff-final.patch" || true
            git -C "$source_root" diff --cached --no-ext-diff --binary > "$artifact_root/source-index-diff-final.patch" || true
            cat "$artifact_root/source-state-final.bin" \
                "$artifact_root/source-diff-final.patch" \
                "$artifact_root/source-index-diff-final.patch" |
              sha256sum | awk '{print $1}' > "$artifact_root/source-state-final.sha256"

            if ! cmp -s "$artifact_root/source-state-initial.bin" "$artifact_root/source-state-final.bin" ||
               ! cmp -s "$artifact_root/source-diff-initial.patch" "$artifact_root/source-diff-final.patch" ||
               ! cmp -s "$artifact_root/source-index-diff-initial.patch" "$artifact_root/source-index-diff-final.patch"; then
              source_changed=1
            fi
          else
            source_changed=1
          fi

          echo "source_changed_during_run=$source_changed" > "$artifact_root/source-integrity.txt"
          ccache -s > "$artifact_root/ccache.txt" 2>&1 || true

          if [[ "$source_changed" != 0 ]]; then
            echo "ReactOS source tree changed during build or runtime" >&2
            exit 1
          fi

      - name: Collect target artifacts
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('build')
          out = Path('artifacts/files')
          out.mkdir(parents=True, exist_ok=True)
          targets = [line.strip() for line in Path('targets.txt').read_text().splitlines() if line.strip()]
          stems = {Path(t).name.lower() for t in targets}
          always_names = {'bootcd.iso', 'bootcdregtest.iso', 'liveimg.iso'}
          copied = []
          if root.exists():
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  name = path.name.lower()
                  stem = path.stem.lower()
                  if name in always_names or stem in stems or name in stems:
                      rel = path.relative_to(root)
                      dest = out / rel
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      try:
                          shutil.copy2(path, dest)
                          copied.append(str(rel))
                      except OSError as exc:
                          print(f'warning: could not copy {path}: {exc}')
          Path('artifacts/collected-files.txt').write_text('\n'.join(copied) + ('\n' if copied else ''))
          print(f'Collected {len(copied)} target artifacts')
          PY

      - name: Upload logs and compiled target artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reactos-${{ inputs.compiler }}-${{ inputs.arch }}-${{ inputs.build_type }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
